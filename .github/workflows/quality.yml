name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify foundation
        run: bun run verify:foundation

      - name: Verify P3 domain contracts
        run: bun run verify:p3

      - name: Verify P4 canonical health data
        run: bun run verify:p4

      - name: Verify P5 device adapter SDK
        run: bun run verify:p5

      - name: Verify P6 wearables integration
        run: bun run verify:p6

      - name: Verify P7 medical and lab integration
        run: bun run verify:p7

      - name: Verify P8 environmental and radiation telemetry
        run: bun run verify:p8
      - name: Verify P9 astronaut live dashboard
        run: bun run verify:p9

      - name: Verify P10 personal baseline engine
        run: bun run verify:p10

      - name: Verify P11 cognitive and behavioral module
        run: bun run verify:p11

      - name: Verify P12 Health Intelligence v1
        run: bun run verify:p12

      - name: Verify P13 Action and Protocol Guidance
        run: bun run verify:p13

      - name: Verify P14 Offline Mission Mode
        run: bun run verify:p14

      - name: Verify P15 Ground / Research Console
        run: bun run verify:p15

      - name: Verify P16 security and safety hardening
        run: bun run verify:p16

      - name: Verify P17 simulation and synthetic mission dataset
        run: bun run verify:p17

      - name: Verify P18 validation and usability
        run: bun run verify:p18

      - name: Security boundary audit
        run: bun run security:audit

      - name: Domain and integration tests
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Production build
        run: bun run build
