name: Medical v3 Release Gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Frozen dependency graph
        run: bun install --frozen-lockfile
      - name: Reproduce sealed synthetic release sample
        run: bun run sample:release
      - name: Full repository checks
        run: bun run check
      - name: All static scientific and private-evidence gates
        if: ${{ !cancelled() }}
        run: node scripts/medical-v3-static-checks.mjs
      - name: Full tests
        if: ${{ !cancelled() }}
        run: bun run test
      - name: Full typecheck
        if: ${{ !cancelled() }}
        run: bun run typecheck
      - name: Lint
        if: ${{ !cancelled() }}
        run: bun run lint
      - name: Formatting
        if: ${{ !cancelled() }}
        run: bun run format:check
      - name: Production build
        if: ${{ !cancelled() }}
        run: bun run build
      - name: Medical release guard
        if: ${{ !cancelled() }}
        run: node scripts/verify-medical-v3-release-gate.mjs
      - name: Full scope Trivy vulnerabilities and secrets
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_INCLUDE_DEV_DEPS: "true"
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: "false"
      - name: Release evidence summary
        if: always()
        run: |
          echo "Checked commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow does NOT attest staging browser acceptance or private evidence." >> "$GITHUB_STEP_SUMMARY"
