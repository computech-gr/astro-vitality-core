name: Medical v3 Exact Commit Status
on:
  workflow_run:
    workflows: ["Quality", "Security Scan", "Medical v3 Release Gate"]
    types: [completed]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Report actual checks for exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ['REPO']; sha=os.environ['TARGET_SHA']; token=os.environ['GH_TOKEN']
          names=['Quality','Security Scan','Medical v3 Release Gate']; runs=[]; page=1
          while True:
              url=f'https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&per_page=100&page={page}'
              req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=30) as resp: batch=json.load(resp)['workflow_runs']
              runs.extend(batch)
              if len(batch)<100: break
              page+=1
              if page>100: raise RuntimeError('Incomplete workflow inventory; status remains UNVERIFIED')
          lines=[f'## Medical v3 checks for `{sha}`','', '| Workflow | Run | Status | Conclusion |','|---|---|---|---|']
          complete=True
          for name in names:
              matches=[r for r in runs if r['name']==name and r['head_sha']==sha]
              matches.sort(key=lambda r:(r['created_at'],r['id'],r['run_attempt']),reverse=True)
              if not matches:
                  lines.append(f'| {name} | — | missing | UNVERIFIED |'); complete=False; continue
              r=matches[0]; status=r['status']; result=r['conclusion'] or 'pending'
              lines.append(f"| {name} | [#{r['run_number']}]({r['html_url']}) | {status} | {result} |")
              complete &= status=='completed' and result=='success'
          lines.extend(['',f'**All three green on exact SHA:** {"YES" if complete else "NO — NOT RELEASE READY"}', '', 'This report does not certify staging acceptance, private evidence, or medical validity.'])
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY
