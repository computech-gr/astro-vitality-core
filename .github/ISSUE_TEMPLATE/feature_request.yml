name: Feature request
description: Propose a product or engineering improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: User or mission need
      description: Describe the concrete problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety, privacy, offline, and scientific implications
      description: Identify any effect on medical wording, data quality, provenance, mission autonomy, or privacy.
