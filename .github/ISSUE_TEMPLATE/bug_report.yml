name: Bug report
description: Report a reproducible software defect.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include real astronaut/patient data, credentials, tokens, or other secrets.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide a minimal reproducible sequence using synthetic/public data only.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or release
      placeholder: v0.x or commit SHA
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser/runtime, device class, and relevant adapter type. Do not paste secrets.
